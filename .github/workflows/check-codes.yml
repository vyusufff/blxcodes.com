name: Auto sync codes

# Every 2 hours: update existing codes, add a few new live games, deploy only if changed.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      max_new_games:
        description: "Max new games this run (default 5; catch-up e.g. 200)"
        required: false
        default: "5"
      max_scan:
        description: "Max hub candidates to scan for new games"
        required: false
        default: "120"
      min_playing:
        description: "Skip new games below this CCU"
        required: false
        default: "50"

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-sync-codes
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync existing + discover new
        env:
          MAX_NEW_GAMES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_new_games || '5' }}
          MAX_SCAN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_scan || '120' }}
          MIN_PLAYING: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.min_playing || '50' }}
        run: node scripts/check-codes.mjs --write

      - name: Commit changes if any
        id: commit
        run: |
          set -e
          git config user.name "blxcodes-bot"
          git config user.email "bot@blxcodes.com"
          git add src/content/games scripts/sources.json public/images/games || true
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content changes."
          else
            git commit -m "chore: auto-sync codes and new games $(date -u +%Y-%m-%dT%H:%MZ)"
            git fetch origin main
            if ! git rebase origin/main; then
              # A curated edit landed while this run was scraping. Auto-resolving
              # would silently revert it, so drop this run's output instead; the
              # next run redoes the same work on the fresh base.
              git rebase --abort || true
              git reset --hard origin/main
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Rebase conflict with origin/main - skipping this run."
              exit 0
            fi
            if ! git push origin HEAD:main; then
              # Lost a race between fetch and push; retry once on the new tip.
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; git reset --hard origin/main; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; }
              git push origin HEAD:main
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=blxcodes

      - name: Wait before deploy retry
        if: steps.commit.outputs.changed == 'true' && steps.deploy.outcome == 'failure'
        run: sleep 45

      - name: Retry Cloudflare deploy
        id: deploy2
        if: steps.commit.outputs.changed == 'true' && steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=blxcodes

      - name: Wait before second deploy retry
        if: steps.commit.outputs.changed == 'true' && steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90

      - name: Retry Cloudflare deploy again
        if: steps.commit.outputs.changed == 'true' && steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=blxcodes

      - name: IndexNow ping
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/ping-indexnow.mjs
