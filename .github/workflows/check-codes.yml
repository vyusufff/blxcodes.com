name: Auto sync codes

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      max_new_games:
        description: "Max new games to add this run (catch-up: 200)"
        required: false
        default: "5"
      max_scan:
        description: "Max hub candidates to scan"
        required: false
        default: "40"
      min_playing:
        description: "Skip new games below this CCU"
        required: false
        default: "50"

permissions:
  contents: write
  actions: read

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync codes from sources
        env:
          MAX_NEW_GAMES: ${{ github.event.inputs.max_new_games || '5' }}
          MAX_SCAN: ${{ github.event.inputs.max_scan || '40' }}
          MIN_PLAYING: ${{ github.event.inputs.min_playing || '50' }}
        run: node scripts/check-codes.mjs --write

      - name: Commit changes if any
        id: commit
        run: |
          git config user.name "blxcodes-bot"
          git config user.email "bot@blxcodes.com"
          git add src/content/games scripts/sources.json public/images/games || true
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content changes."
          else
            git commit -m "chore: auto-sync codes and new games $(date -u +%Y-%m-%dT%H:%MZ)"
            # Avoid losing catch-up when another push landed mid-run
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=blxcodes
        # Cloudflare asset upload occasionally returns 525 / malformed HTML
        continue-on-error: true
        id: deploy

      - name: Retry Cloudflare deploy
        if: steps.deploy.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=blxcodes

      - name: IndexNow ping
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/ping-indexnow.mjs
